<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Patch iPod firmware locally in your browser.">
  <title>iPod Firmware Patcher</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <main>
    <header>
      <h1>iPod Firmware Patcher</h1>
    </header>
    <form id="form" aria-busy="false">
      <label for="firmware">IPSW</label>
      <input id="firmware" type="file" accept=".ipsw,application/zip">
      <label for="patch-file">Patch</label>
      <input id="patch-file" type="file" accept=".ipepatch">
      <div class="actions">
        <button id="patch" type="submit" disabled>Apply</button>
        <button id="cancel" type="button" class="secondary" hidden>Cancel</button>
      </div>
      <progress id="progress" aria-label="Patching firmware" hidden></progress>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title"></h2>
      <p id="result-size" class="hint"></p>
      <a id="download" class="button">Download IPSW</a>
      <details class="verification">
        <summary>SHA-256</summary>
        <dl><dt>Original IPSW</dt><dd id="source-hash"></dd><dt>Patched IPSW</dt><dd id="output-hash"></dd></dl>
      </details>
    </section>
    <footer>
      <a href="https://theapplewiki.com/wiki/Firmware/iPod" rel="noreferrer" target="_blank">IPSWs</a>
      <a href="https://github.com/sd-zhang/ipod-enhanced/releases" rel="noreferrer" target="_blank">Patches</a>
      <a href="https://github.com/sd-zhang/ipod-enhanced" rel="noreferrer" target="_blank">GitHub</a>
      <details><summary>Licenses</summary>{{LICENSES}}</details>
    </footer>
    <noscript><p class="error">JavaScript required.</p></noscript>
  </main>
  <script type="application/json" id="worker-code">{{WORKER}}</script>
  <script>{{APP}}</script>
</body>
</html>
