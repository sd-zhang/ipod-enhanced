<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Create iPod Enhanced firmware locally in your browser from an original Apple IPSW.">
  <title>iPod Enhanced · Firmware patcher</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <main>
    <header>
      <h1>iPod Enhanced patcher</h1>
    </header>
    <form id="form" aria-busy="false">
      <label for="firmware">Stock IPSW</label>
      <input id="firmware" type="file" accept=".ipsw,application/zip" aria-describedby="firmware-help">
      <p id="firmware-help" class="hint"><a href="https://github.com/sd-zhang/ipod-enhanced#tested-compatibility" rel="noreferrer" target="_blank">Firmware downloads</a></p>
      <label for="patch-file">Patch (.ipepatch)</label>
      <input id="patch-file" type="file" accept=".ipepatch" aria-describedby="patch-help">
      <p id="patch-help" class="hint"><a href="https://github.com/sd-zhang/ipod-enhanced/releases" rel="noreferrer" target="_blank">Patch downloads</a></p>
      <div class="actions">
        <button id="patch" type="submit" disabled>Apply patch</button>
        <button id="cancel" type="button" class="secondary" hidden>Cancel</button>
      </div>
      <progress id="progress" aria-label="Patching firmware" hidden></progress>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title"></h2>
      <p id="result-size" class="hint"></p>
      <a id="download" class="button">Download IPSW</a>
      <details class="verification">
        <summary>SHA-256</summary>
        <dl><dt>Original IPSW</dt><dd id="source-hash"></dd><dt>Patched IPSW</dt><dd id="output-hash"></dd></dl>
      </details>
    </section>
    <aside class="notes">
      <p>Local processing. No uploads.</p>
      <p>Developer preview. Installer not included.</p>
    </aside>
    <footer>
      <nav aria-label="Project links"><a href="https://github.com/sd-zhang/ipod-enhanced" rel="noreferrer" target="_blank">GitHub</a><a href="https://github.com/sd-zhang/ipod-enhanced/blob/main/docs/USER_GUIDE.md" rel="noreferrer" target="_blank">User guide</a></nav>
      <p>Uses <a href="https://github.com/marcrobledo/RomPatcher.js" rel="noreferrer" target="_blank">Rom Patcher JS</a>.</p>
      <details><summary>Licenses</summary>{{LICENSES}}</details>
    </footer>
    <noscript><p class="error">JavaScript required.</p></noscript>
  </main>
  <script type="application/json" id="worker-code">{{WORKER}}</script>
  <script>{{APP}}</script>
</body>
</html>
