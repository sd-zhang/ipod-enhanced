# Native/emulator fixtures keep their established style and unittest conventions.
# The verifier applies E9,F63,F7,F82 to every public Python file; the public
# release tools additionally receive formatting, pyflakes/import and type checks.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["release_tools"]
mypy_path = "release_tools"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

# These two libraries do not ship PEP 561 types; our code is still checked.
[[tool.mypy.overrides]]
module = ["bsdiff4", "yaml"]
ignore_missing_imports = true
